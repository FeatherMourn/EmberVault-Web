name: EmberVault Web CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public site
        run: python tools/verify_site.py
      - name: Verify catalog
        run: python tools/verify_catalog.py embervault-catalog.json
